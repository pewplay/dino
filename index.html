<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>T-Rex Dino</title>
  <meta name="theme-color" content="#f7f7f7">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" data-state="waiting">
    <canvas id="game" aria-label="T-Rex Dino game area"></canvas>

    <div class="below">
      <p class="msg msg-waiting">
        <span class="kb">Press <kbd>Space</kbd> or <kbd>&uarr;</kbd> to jump</span>
        <span class="tp">Tap to jump</span>
      </p>
      <p class="sub msg-waiting">
        <span class="kb">Hold for a higher jump &middot; <kbd>&darr;</kbd> to drop faster</span>
        <span class="tp">Hold for a higher jump &middot; swipe down to drop faster</span>
      </p>
      <p class="msg msg-crashed" id="over-text"></p>
      <p class="sub msg-crashed">
        <span class="kb">Press <kbd>Space</kbd> or click to play again</span>
        <span class="tp">Tap to play again</span>
      </p>
    </div>

    <button id="mute" type="button" aria-label="Mute sound">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="no" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
    </button>

    <div id="paused" role="button" aria-label="Resume game">
      <div class="panel">
        <strong>Paused</strong>
        <span class="kb">Press <kbd>Space</kbd> or click to continue</span>
        <span class="tp">Tap to continue</span>
      </div>
    </div>

    <p id="rotate">Rotate your device for a bigger view</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
